name: "Sasthyaloy CI/CD - Build & Release Android APK"

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: "Build Android Release APK"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "১. কোড চেকআউট (Checkout Repository)"
        uses: actions/checkout@v4

      - name: "২. জাভা এনভায়রনমেন্ট কনফিগারেশন (Java 17)"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "৩. ফ্ল্যাটার এসডিকে সেটআপ (Flutter SDK 3.24.x)"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: "৪. ফ্ল্যাটার ডিপেন্ডেন্সি ডাউনলোড (flutter pub get)"
        run: flutter pub get

      - name: "৫. কোড অ্যানালাইসিস ও সিনট্যাক্স ভ্যালিডেশন"
        run: flutter analyze --no-fatal-infos

      - name: "৬. প্রোডাকশন রিলিজ APK বিল্ড (Release APK)"
        run: flutter build apk --release --no-tree-shake-icons

      - name: "৭. বিল্ড করা APK আর্টফ্যাক্টসে আপলোড (Upload Artifact)"
        uses: actions/upload-artifact@v4
        with:
          name: Sasthyaloy-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: "৮. গিটহাব রিলিজ পাবলিশ (Create GitHub Release if Tagged)"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: "স্বাস্থ্যালয় রিলিজ ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## স্বাস্থ্যালয় (Sasthyaloy) - ডিজিটাল হেলথকেয়ার মোবাইল অ্যাপ
            অ্যান্ড্রয়েড ফোনের জন্য সর্বশেষ প্রোডাকশন রিলিজ APK ফাইল নিচে যুক্ত করা হয়েছে।
            
            ### ডাউনলোড ও ইনস্টলেশন:
            1. নিচে `Assets` সেকশন থেকে `app-release.apk` ফাইলে ক্লিক করে ডাউনলোড করুন।
            2. আপনার ফোনে সরাসরি ইনস্টল করুন।
