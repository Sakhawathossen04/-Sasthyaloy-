name: "Sasthyaloy CI/CD - Build & Release Android APK"

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: "Build Android Release APK"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "১. কোড চেকআউট (Checkout Repository)"
        uses: actions/checkout@v4

      - name: "২. জাভা এনভায়রনমেন্ট কনফিগারেশন (Java 17)"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "৩. ফ্ল্যাটার এসডিকে সেটআপ (Flutter SDK)"
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: "৪. অ্যান্ড্রয়েড লাইসেন্স ও হেলথ চেক (Accept Android Licenses)"
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: "৫. অফিসিয়াল অ্যান্ড্রয়েড প্ল্যাটফর্ম কনফিগারেশন (Official Android Setup)"
        run: |
          rm -rf android
          flutter create . --org com.sasthyaloy --project-name sasthyaloy --platforms=android
          chmod +x android/gradlew
          python3 scripts/setup_android.py

      - name: "৬. ফ্ল্যাটার ডিপেন্ডেন্সি ডাউনলোড (flutter pub get)"
        run: flutter pub get

      - name: "৭. কোড অ্যানালাইসিস (Code Analysis)"
        run: flutter analyze || true

      - name: "৮. ইউনিট টেস্ট (Smoke Test)"
        run: |
          set +e
          flutter test --reporter expanded > test_log.txt 2>&1
          TEST_EXIT=$?
          set -e
          cat test_log.txt
          echo "### Unit Test Summary (Exit: $TEST_EXIT)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 100 test_log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $TEST_EXIT -ne 0 ]; then
            echo "::error::Unit tests failed with exit code $TEST_EXIT"
            grep -E -C 2 "(FAILED|Error|Exception|failed)" test_log.txt | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $TEST_EXIT
          fi

      - name: "৯. অ্যান্ড্রয়েড রিলিজ APK বিল্ড (Build Android Release APK)"
        run: |
          set +e
          echo "Building Production Release APK..."
          flutter build apk --release --no-tree-shake-icons > build_log.txt 2>&1
          BUILD_EXIT=$?
          set -e
          cat build_log.txt
          echo "### Release APK Build Summary (Exit: $BUILD_EXIT)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build_log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Release APK build failed with exit code $BUILD_EXIT"
            grep -E -C 2 "(FAILURE|BUILD FAILED|Gradle build failed|Error:|Exception)" build_log.txt | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $BUILD_EXIT
          fi

      - name: "১০. বিল্ড করা APK আর্টফ্যাক্টসে আপলোড (Upload APK Artifacts)"
        uses: actions/upload-artifact@v4
        with:
          name: Sasthyaloy-Release-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/**/*.apk
          retention-days: 14

      - name: "ডায়াগনস্টিক লগ আপলোড (Upload Diagnostic Logs on Failure)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sasthyaloy-Diagnostics
          path: |
            test_log.txt
            build_log.txt
          retention-days: 7

      - name: "১১. গিটহাব রিলিজ পাবলিশ (Create GitHub Release if Tagged)"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          name: "স্বাস্থ্যালয় রিলিজ ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## স্বাস্থ্যালয় (Sasthyaloy) - ডিজিটাল হেলথকেয়ার মোবাইল অ্যাপ
            অ্যান্ড্রয়েড ফোনের জন্য সর্বশেষ APK ফাইল নিচে যুক্ত করা হয়েছে।
