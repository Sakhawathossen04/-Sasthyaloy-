name: "Sasthyaloy CI/CD - Build & Release Android APK"

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: "Build Android Release APK"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "১. কোড চেকআউট (Checkout Repository)"
        uses: actions/checkout@v4

      - name: "২. জাভা এনভায়রনমেন্ট কনফিগারেশন (Java 17)"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "৩. ফ্ল্যাটার এসডিকে সেটআপ (Flutter SDK)"
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: "৪. অফিসিয়াল অ্যান্ড্রয়েড প্ল্যাটফর্ম কনফিগারেশন (Official Android Setup)"
        run: |
          rm -rf android
          flutter create . --org com.sasthyaloy --project-name sasthyaloy --platforms=android
          chmod +x android/gradlew

      - name: "৫. ফ্ল্যাটার ডিপেন্ডেন্সি ডাউনলোড (flutter pub get)"
        run: flutter pub get

      - name: "৬. কোড অ্যানালাইসিস (Code Analysis)"
        run: flutter analyze || true

      - name: "৭. ইউনিট টেস্ট (Smoke Test)"
        run: flutter test

      - name: "৮. প্রোডাকশন রিলিজ APK বিল্ড (Build Android Release APK)"
        id: build_apk
        run: |
          echo "Starting Flutter APK build..."
          flutter build apk --release --no-tree-shake-icons > build.log 2>&1 || {
            echo "::error::BUILD FAILED! Showing last 100 lines of build.log:"
            tail -n 100 build.log
            exit 1
          }

      - name: "৯. বিল্ড লগ সংরক্ষণ (Upload Build Log on Failure)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sasthyaloy-Build-Log
          path: build.log
          retention-days: 7

      - name: "১০. বিল্ড করা APK আর্টফ্যাক্টসে আপলোড (Upload Artifact)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sasthyaloy-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: "১১. গিটহাব রিলিজ পাবলিশ (Create GitHub Release if Tagged)"
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: "স্বাস্থ্যালয় রিলিজ ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## স্বাস্থ্যালয় (Sasthyaloy) - ডিজিটাল হেলথকেয়ার মোবাইল অ্যাপ
            অ্যান্ড্রয়েড ফোনের জন্য সর্বশেষ প্রোডাকশন রিলিজ APK ফাইল নিচে যুক্ত করা হয়েছে।
