name: "Sasthyaloy CI/CD - Build & Release Android APK"

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: "Build Android Release APK"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "১. কোড চেকআউট (Checkout Repository)"
        uses: actions/checkout@v4

      - name: "২. জাভা এনভায়রনমেন্ট কনফিগারেশন (Java 17)"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "৩. ফ্ল্যাটার এসডিকে সেটআপ (Flutter SDK)"
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: "৪. অ্যান্ড্রয়েড লাইসেন্স ও হেলথ চেক (Accept Android Licenses)"
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: "৫. অফিসিয়াল অ্যান্ড্রয়েড প্ল্যাটফর্ম কনফিগারেশন (Official Android Setup)"
        run: |
          rm -rf android
          flutter create . --org com.sasthyaloy --project-name sasthyaloy --platforms=android
          chmod +x android/gradlew

      - name: "৬. ফ্ল্যাটার ডিপেন্ডেন্সি ডাউনলোড (flutter pub get)"
        run: flutter pub get

      - name: "৭. কোড অ্যানালাইসিস (Code Analysis)"
        run: flutter analyze || true

      - name: "৮. ইউনিট টেস্ট (Smoke Test)"
        run: flutter test

      - name: "৯. অ্যান্ড্রয়েড APK বিল্ড (Build Android APK)"
        run: |
          echo "Building Android APK..."
          flutter build apk --debug > build_debug.log 2>&1 || {
            echo "::error::Debug APK Build Failed! Showing error log:"
            grep -E -C 2 "(Error|FAILED|Exception|error:|FAILURE)" build_debug.log | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: "১০. বিল্ড করা APK আর্টফ্যাক্টসে আপলোড (Upload APK Artifacts)"
        uses: actions/upload-artifact@v4
        with:
          name: Sasthyaloy-APK
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: "১১. গিটহাব রিলিজ পাবলিশ (Create GitHub Release if Tagged)"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          name: "স্বাস্থ্যালয় রিলিজ ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## স্বাস্থ্যালয় (Sasthyaloy) - ডিজিটাল হেলথকেয়ার মোবাইল অ্যাপ
            অ্যান্ড্রয়েড ফোনের জন্য সর্বশেষ APK ফাইল নিচে যুক্ত করা হয়েছে।
