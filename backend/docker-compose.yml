version: '3.8'

services:
  # PostgreSQL 16 with PostGIS
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: sasthyaloy_postgres
    restart: always
    environment:
      POSTGRES_DB: sasthyaloy_db
      POSTGRES_USER: sasthyaloy_admin
      POSTGRES_PASSWORD: SasthyaloySecurePassword2026!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/02_seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql
    networks:
      - sasthyaloy_network

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: sasthyaloy_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - sasthyaloy_network

  # Backend REST & WebRTC API Server
  api:
    build: .
    container_name: sasthyaloy_api
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgres://sasthyaloy_admin:SasthyaloySecurePassword2026!@db:5432/sasthyaloy_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: Sasthyaloy_Super_Secure_JWT_Key_2026_BanglaHealthcare
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
    networks:
      - sasthyaloy_network

volumes:
  pgdata:

networks:
  sasthyaloy_network:
    driver: bridge
